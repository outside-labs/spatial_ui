name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: node --check src/spatial_ui/static/runtime.js
      - run: node tests/live_runtime.mjs
      - run: uv build --no-sources
      - name: Install and verify wheel and source distribution
        run: uv run --locked python scripts/verify_distributions.py --receipt-file live-installed-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-installed-${{ matrix.os }}
          path: live-installed-receipt.json
          if-no-files-found: error

  browser:
    name: Chromium form interaction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - run: uv sync --locked --group browser-tests --group reference-tests
      - run: uv run --frozen python -m playwright install --with-deps chromium
      - run: uv run --frozen python -m unittest discover -s tests -p browser_forms.py -v
      - run: uv run --frozen python -m unittest discover -s tests -p browser_tables.py -v
      - run: uv run --frozen python -W error::ResourceWarning -m unittest discover -s tests -p browser_table_edits.py -v
      - run: uv run --frozen python -W error::ResourceWarning -m unittest discover -s tests -p browser_asgi.py -v
      - run: uv run --frozen python -W error::ResourceWarning -m unittest discover -s tests -p browser_live.py -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asgi-browser-receipt
          path: |
            asgi-browser-receipt.json
            live-browser-receipt.json
          if-no-files-found: error

  rest-profile:
    name: Checked REST service profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
      - run: uv sync --locked --group reference-tests
      - run: uv run --locked --group reference-tests python -m unittest discover -s tests -p test_reference_form.py -v
