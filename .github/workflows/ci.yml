name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: node --check src/spatial_ui/static/runtime.js
      - run: uv build --no-sources
      - name: Install and verify wheel and source distribution
        shell: bash
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*; do
            envdir="$RUNNER_TEMP/install-$(basename "$artifact")"
            uv venv "$envdir" --python 3.14
            uv pip install --python "$envdir" "$artifact"
            cd "$RUNNER_TEMP"
            if [ -f "$envdir/Scripts/python.exe" ]; then
              pythonbin="$envdir/Scripts/python.exe"
            else
              pythonbin="$envdir/bin/python"
            fi
            "$pythonbin" -I -m spatial_ui --version
            "$pythonbin" -I -c 'from spatial_ui import Session; from spatial_ui.demo import Dashboard, demo_stylesheet; from importlib.resources import files; assert len(Session(Dashboard()).render().event_ids) == 4; assert demo_stylesheet(); assert files("spatial_ui").joinpath("static", "runtime.js").is_file()'
          done
