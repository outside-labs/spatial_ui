name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Require a public repository
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: test "$REPOSITORY_PRIVATE" = false
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: node --check src/spatial_ui/static/runtime.js
      - run: uv build --no-sources
      - name: Verify tag, metadata, license, assets, and installed distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --locked python scripts/verify_distributions.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spatial-ui/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Publish distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
