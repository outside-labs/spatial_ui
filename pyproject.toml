[project]
name = "spatial-ui"
version = "0.1.0"
description = "A Python spatial UI engine with square grids and t-string templates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/outside-labs/spatial_ui"
Issues = "https://github.com/outside-labs/spatial_ui/issues"
Changelog = "https://github.com/outside-labs/spatial_ui/blob/main/CHANGELOG.md"

[project.scripts]
spatial-ui = "spatial_ui.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
