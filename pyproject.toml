[project]
name = "spatial-ui"
version = "0.1.0"
description = "A Python spatial UI engine with square grids and t-string templates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/outside-labs/spatial_ui"
Issues = "https://github.com/outside-labs/spatial_ui/issues"
Changelog = "https://github.com/outside-labs/spatial_ui/blob/main/CHANGELOG.md"

[project.scripts]
spatial-ui = "spatial_ui.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
browser-tests = ["playwright==1.64.0"]
reference-tests = [
    "compose-application @ git+https://github.com/outside-labs/compose_application.git@dc49317ca006230e69b5784c9f3697c9e51a3e9e",
    "expose-api[backpack] @ git+https://github.com/outside-labs/expose_api.git@0e46c4bd425257a518193d4064a339cb4996c86e",
]
